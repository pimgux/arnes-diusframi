<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d">
  <title id="t">Arnés Diusframi</title>
  <desc id="d">Banner animado del arnés de trabajo de Diusframi para Claude Code</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C4E"/>
      <stop offset="0.55" stop-color="#0053FF"/>
      <stop offset="1" stop-color="#FF5100"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="260" rx="20"/></clipPath>
  </defs>
  <style>
    .title { font: 700 52px 'Inter','Segoe UI',Arial,sans-serif; fill: #fff; letter-spacing: -1px; }
    .sub   { font: 400 20px 'Inter','Segoe UI',Arial,sans-serif; fill: #DDE1EE; }
    .tag   { font: 500 18px 'Inter','Segoe UI',Arial,sans-serif; fill: #FFD040; opacity: 0; }
    .orb   { fill: #fff; opacity: .10; }
    .o1 { animation: float 9s ease-in-out infinite; }
    .o2 { animation: float 12s ease-in-out -4s infinite; }
    .o3 { animation: float 15s ease-in-out -8s infinite; }
    .shine { animation: shine 6s ease-in-out infinite; }
    .t1 { animation: cycle 12s infinite; }
    .t2 { animation: cycle 12s 4s infinite; }
    .t3 { animation: cycle 12s 8s infinite; }
    .enter { opacity: 0; animation: enter 1s .1s ease-out forwards; }
    .enter2 { opacity: 0; animation: enter 1s .4s ease-out forwards; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-22px) } }
    @keyframes shine { 0% { transform: translateX(-300px) } 60%,100% { transform: translateX(1200px) } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(8px) } 6%,28% { opacity: 1; transform: translateY(0) } 34%,100% { opacity: 0; transform: translateY(-8px) } }
    @keyframes enter { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) {
      .o1,.o2,.o3,.shine,.t1,.t2,.t3,.enter,.enter2 { animation: none; opacity: 1; }
      .t2,.t3 { opacity: 0; }
      .shine { opacity: 0; }
    }
  </style>
  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <circle class="orb o1" cx="780" cy="70" r="90"/>
    <circle class="orb o2" cx="650" cy="210" r="60"/>
    <circle class="orb o3" cx="860" cy="200" r="40"/>
    <rect class="shine" x="0" y="-20" width="90" height="300" fill="#fff" opacity=".08" transform="skewX(-20)"/>
    <text class="title enter" x="56" y="120">Arnés Diusframi</text>
    <text class="sub enter2" x="58" y="156">Claude Code trabajando con orden, memoria y seguridad.</text>
    <text class="tag t1" x="58" y="205">▸ Planifica antes de construir</text>
    <text class="tag t2" x="58" y="205">▸ Cada pieza nace con su test</text>
    <text class="tag t3" x="58" y="205">▸ Las reglas se cumplen por mecanismo, no por memoria</text>
  </g>
</svg>
